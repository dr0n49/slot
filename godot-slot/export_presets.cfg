html/head_include="<style>
/* Transparent-canvas overrides for the React embed: the default export
   template paints an opaque black body/loading-screen background, which
   would hide the golden frame/background React already draws behind this
   iframe. viewport/transparent_background in project.godot makes the
   WebGL canvas itself request an alpha context; these two rules stop the
   surrounding page chrome from painting over it with black. */
body { background-color: transparent !important; }
#status { background-color: transparent !important; }
/* No Godot boot logo flashing inside React's golden frame while loading. */
#status-splash { display: none !important; }
</style>
<script>
/* Audio unlock for the React embed: Godot only resumes its AudioContext on
   input events inside its own canvas, but in the embed every click lands on
   React's HUD in the parent page, so the context would stay suspended (no
   SFX at all). Record every AudioContext Godot creates so the parent page
   (same origin) can resume them from inside its own click handler; see
   SlotGame.tsx resumeAudio(). */
(function () {
  var A = window.AudioContext || window.webkitAudioContext;
  if (!A) return;
  window.__godotAudioCtxs = [];
  var W = class extends A {
    constructor(opts) { super(opts); window.__godotAudioCtxs.push(this); }
  };
  window.AudioContext = W;
  if (window.webkitAudioContext) window.webkitAudioContext = W;
})();
</script>
"
