<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Faceted hexagon plaque for the Bonus Bank ×N badge (BonusBanner.tsx).
       Separate from ink-plate.svg's scalloped-banner silhouette — a plain
       hexagon (sharp cut left/right corners only) was asked for instead. -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#3a0d12"/>
      <stop offset="1" stop-color="#0c0607"/>
    </radialGradient>
  </defs>
  <g stroke-linejoin="round">
    <polygon points="4,60 32,12 168,12 196,60 168,108 32,108"
             fill="#0a0506" stroke="#0a0506" stroke-width="10"/>
    <polygon points="4,60 32,12 168,12 196,60 168,108 32,108"
             fill="url(#glow)" stroke="#f3e9d2" stroke-width="3.5"/>
    <polygon points="22,60 42,26 158,26 178,60 158,94 42,94"
             fill="none" stroke="#c8102e" stroke-width="2"/>
  </g>
</svg>
