<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Design scale preview — 1200×675 / 800×450 / 400×225</title>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				padding: 24px;
				background: #1e293b;
				color: #f8fafc;
				font-family: system-ui, sans-serif;
			}
			h1 {
				margin: 0 0 8px;
				font-size: 20px;
			}
			p {
				margin: 0 0 24px;
				color: #94a3b8;
				max-width: 720px;
				line-height: 1.5;
			}
			.grid {
				display: flex;
				flex-wrap: wrap;
				gap: 32px;
				align-items: flex-start;
			}
			.panel {
				flex: 0 0 auto;
			}
			.panel h2 {
				margin: 0 0 8px;
				font-size: 14px;
				font-weight: 600;
			}
			.panel .meta {
				margin: 0 0 10px;
				font-size: 12px;
				color: #cbd5e1;
			}
			.frame {
				overflow: hidden;
				border: 2px solid #ffd54a;
				background: #000;
				box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
			}
			iframe {
				display: block;
				border: 0;
				width: 100%;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<h1>Proportional design scaling (16:9)</h1>
		<p>
			Each frame is an iframe at the exact Stake container size. Layout is authored at
			1200×675 and scaled uniformly via a shared scale factor.
		</p>
		<div class="grid">
			<div class="panel">
				<h2>Stake iframe</h2>
				<p class="meta">1200×675 · scale 1.0</p>
				<div class="frame" style="width: 1200px; height: 675px">
					<iframe src="/" title="1200x675"></iframe>
				</div>
			</div>
			<div class="panel">
				<h2>Mini player (expanded)</h2>
				<p class="meta">800×450 · scale ≈ 0.667</p>
				<div class="frame" style="width: 800px; height: 450px">
					<iframe src="/" title="800x450"></iframe>
				</div>
			</div>
			<div class="panel">
				<h2>Mini player</h2>
				<p class="meta">400×225 · scale ≈ 0.333</p>
				<div class="frame" style="width: 400px; height: 225px">
					<iframe src="/" title="400x225"></iframe>
				</div>
			</div>
		</div>
	</body>
</html>
